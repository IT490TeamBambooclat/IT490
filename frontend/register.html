<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f3;
            text-align: center;
            padding-top: 80px;
        }

        /* Top nav (clickable company name/logo) */
        .navbar {
            background-color: #004080;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
        }
        .navbar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar img { height: 30px; }
        .navbar a { color: white; text-decoration: none; font-weight: bold; }
        .navbar .menu a { margin-left: 16px; color: white; text-decoration: none; font-weight: bold; }

        .container {
            background-color: white;
            width: 400px;
            margin: 110px auto 20px auto; /* leave room for fixed navbar */
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 10px;
            text-align: left;
        }
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            background-color: #004080;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0066cc;
        }
        #textResponse {
            margin-top: 15px;
            color: #333;
        }
        fieldset { border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin-top: 16px; text-align: left; }
        legend { font-weight: bold; color: #004080; }
        .role-options { display:flex; gap:12px; margin-top:8px; }
        .role-options label { display:flex; align-items:center; gap:6px; font-weight: normal; }
        .small-note { font-size: 13px; color: #666; margin-top:8px; }
    </style>
</head>
<body>

<!-- Top navbar -->
<div class="navbar">
    <div class="logo">
        <a href="index.html"><img src="logo.png" alt="JobConnect Logo"></a>
        <a href="index.html">JobConnect</a>
    </div>
    <div class="menu">
        <a href="index.html">Home</a>
        <a href="#">About</a>
        <a href="index.html">Login</a>
    </div>
</div>

<div class="container">
    <h1>Register</h1>
    <p>Please enter your details below.</p>

    <form onsubmit="event.preventDefault(); sendRegisterRequest();">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <!-- Role selection (single choice) -->
        <fieldset>
            <legend>Role</legend>
            <div class="role-options">
                <label><input type="radio" name="role" value="jobseeker" checked> Job Seeker</label>
                <label><input type="radio" name="role" value="employer"> Employer</label>
            </div>
            <div class="small-note">Choose the account type that best fits you. You can register only as one role.</div>
        </fieldset>

        <!-- Job Alerts (email only) -->
        <fieldset>
            <legend>Job Alerts (optional)</legend>
            <label>
                <input type="checkbox" id="alertEmailEnabled">
                Email notifications
            </label>
            <input type="email" id="alertEmail" placeholder="you@example.com">
        </fieldset>

        <button type="submit">Register</button>
    </form>

    <div id="textResponse">Please enter your details</div>
</div>

<script>
function sendRegisterRequest() {
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    // get role radio
    const roleNodes = document.getElementsByName("role");
    let role = 'jobseeker';
    for (let i=0;i<roleNodes.length;i++){
        if (roleNodes[i].checked) { role = roleNodes[i].value; break; }
    }

    if (!username || !email || !password) {
        document.getElementById("textResponse").innerHTML = "All fields are required.";
        return;
    }

    const alertEmailEnabled = document.getElementById("alertEmailEnabled").checked ? 1 : 0;
    const alertEmail = document.getElementById("alertEmail").value.trim();

    const request = new XMLHttpRequest();
    request.open("POST", "register.php", true);
    request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

    request.onreadystatechange = function () {
        if (this.readyState === 4 && this.status === 200) {
            const jsonResponse = JSON.parse(this.responseText);
            const message = jsonResponse.message || "No response from server.";
            document.getElementById("textResponse").innerHTML = message;

            if (parseInt(jsonResponse.returnCode) === 0) {
                setTimeout(() => window.location.href = "index.html", 2000);
            }
        } else if (this.readyState === 4) {
            document.getElementById("textResponse").innerHTML = "An error occurred. Please try again.";
        }
    };

    request.send(
        "username=" + encodeURIComponent(username) +
        "&email=" + encodeURIComponent(email) +
        "&password=" + encodeURIComponent(password) +
        "&role=" + encodeURIComponent(role) +
        "&alerts_email_enabled=" + alertEmailEnabled +
        "&alerts_email=" + encodeURIComponent(alertEmail)
    );
}
</script>

</body>
</html>
